<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>원기둥 속 사인곡선</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<style>
  :root {
    --bg:#070b18; --ink:#eef3ff; --muted:#a9b6d6; --faint:#6c7898;
    --glass:rgba(14,20,40,.62); --glass-2:rgba(255,255,255,.05); --line:rgba(160,190,255,.16); --line-2:rgba(160,190,255,.3);
    --gold:#ffcf6b; --sine:#ff6f8a; --seam:#5fd4ff;
    --f-body:"Noto Sans KR",system-ui,sans-serif; --f-title:"Gowun Batang",serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:var(--f-body); }
  #stage { position:fixed; inset:0; }
  #labels { position:fixed; inset:0; pointer-events:none; }
  .lbl { font-size:12px; color:var(--muted); background:rgba(8,12,26,.6); border:1px solid var(--line); padding:1px 7px; border-radius:999px; white-space:nowrap; }
  .lbl b { color:var(--ink); }
  .tick { font-family:var(--f-mono); font-size:12px; color:var(--ink); text-shadow:0 1px 6px #000; transform:translateY(14px); }
  .lbl.sine { color:var(--sine); border-color:rgba(255,111,138,.5); font-weight:700; }
  .lbl.seam { color:var(--seam); border-color:rgba(95,212,255,.5); }
  .lbl.gold { color:var(--gold); border-color:rgba(255,207,107,.5); }

  .brand { position:fixed; top:18px; left:22px; z-index:3; max-width:min(460px,60vw); pointer-events:none; }
  .brand .eyebrow { font-size:11px; letter-spacing:.22em; color:var(--gold); font-weight:700; margin:0 0 4px; }
  .brand h1 { font-family:var(--f-title); font-size:clamp(22px,2.8vw,32px); margin:0; line-height:1.15; text-shadow:0 2px 24px rgba(120,160,255,.4); }
  .brand p { margin:6px 0 0; font-size:13px; color:var(--muted); line-height:1.55; }

  button { font:inherit; font-size:13px; font-weight:500; color:var(--ink); background:var(--glass); border:1px solid var(--line-2);
           border-radius:999px; padding:6px 13px; cursor:pointer; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); transition:background .2s,border-color .2s; }
  button:hover { background:rgba(120,160,255,.18); border-color:var(--seam); }
  button[aria-pressed="true"] { background:linear-gradient(135deg,rgba(255,200,90,.42),rgba(255,140,60,.3)); border-color:var(--gold); color:#fff; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }

  .views { position:fixed; top:18px; right:22px; display:flex; gap:6px; z-index:3; flex-wrap:wrap; justify-content:flex-end; }

  .card { position:fixed; z-index:2; background:var(--glass); border:1px solid var(--line); border-radius:16px; padding:11px 13px;
          backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 16px 50px rgba(0,0,0,.4); }
  .card .head { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .card .k { font-size:11px; letter-spacing:.14em; color:var(--gold); font-weight:700; margin:0 auto 0 0; }
  .card .head button { padding:1px 9px; font-size:12px; }

  #ctrl { left:22px; bottom:22px; width:310px; }
  .play { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .play button { font-family:var(--f-mono); padding:5px 12px; }
  .play input { flex:1; accent-color:var(--gold); }
  .sl { display:grid; grid-template-columns:96px 1fr 50px; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); margin:3px 0; }
  .sl input { width:100%; accent-color:var(--gold); }
  .sl output { font-family:var(--f-mono); font-size:12px; color:var(--ink); text-align:right; }
  .steps { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; margin:4px 0 6px; }
  .steps button { padding:4px 0; font-size:12px; font-family:var(--f-mono); }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .chips button { font-size:12px; padding:4px 10px; }

  #math { right:22px; top:66px; width:340px; max-height:calc(100vh - 90px); overflow:auto; }
  #math .row { font-size:12.5px; line-height:1.55; color:var(--muted); margin:6px 0; }
  #math .row b { color:var(--ink); }
  #math .eq { font-size:14px; color:var(--ink); margin:3px 0 2px; overflow-x:auto; overflow-y:hidden; }
  #math .live { font-family:var(--f-mono); font-size:12px; color:var(--ink); background:var(--glass-2); border:1px solid var(--line);
                border-radius:10px; padding:7px 9px; margin-top:8px; line-height:1.75; }
  #math .live .ok { color:#9dff9a; } #math .live .s { color:var(--sine); }
  #math.mini .body { display:none; }
  #math.mini { width:auto; }
  .katex { font-size:1.02em; }

  .caption { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:1; max-width:min(560px,calc(100vw - 720px)); text-align:center;
             font-size:15px; line-height:1.5; color:var(--ink); background:rgba(8,12,26,.55); border:1px solid var(--line); border-radius:14px; padding:8px 16px;
             backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); pointer-events:none; transition:opacity .3s; }
  .caption .n { color:var(--gold); font-family:var(--f-mono); font-weight:500; margin-right:6px; }

  @media (max-width: 1100px) { .caption { left:auto; right:22px; transform:none; bottom:22px; max-width:calc(100vw - 370px); } }
  @media (max-width: 860px) {
    .brand { top:10px; left:12px; } .brand .eyebrow, .brand p { display:none; } .brand h1 { font-size:19px; }
    .views { top:44px; left:10px; right:10px; justify-content:flex-start; } .views button { font-size:11.5px; padding:4px 9px; }
    #ctrl { left:10px; right:10px; bottom:10px; width:auto; padding:9px 11px; }
    #math { top:80px; right:10px; left:auto; width:min(340px,calc(100vw - 20px)); max-height:calc(100vh - 360px); }
    .caption { left:10px; right:10px; bottom:auto; top:118px; max-width:none; font-size:13px; padding:6px 10px; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>

<header class="brand">
  <p class="eyebrow">CYLINDER · PLANE · SINE</p>
  <h1>원기둥을 비스듬히 자르면</h1>
  <p>원기둥을 축과 <b>45°</b>를 이루는 평면으로 자른다. 잘린 원기둥의 옆면을 높이가 가운데인 곳에서 잘라 펼치면, 잘린 자리가 <b>사인곡선</b>이 된다.</p>
</header>

<div class="views" id="views">
  <button data-view="iso" aria-pressed="true">비스듬히</button>
  <button data-view="front">정면</button>
  <button data-view="top">위에서</button>
  <button id="bAuto" aria-pressed="false">카메라 회전</button>
</div>

<section class="card" id="ctrl" aria-label="조작">
  <div class="play">
    <button id="bPlay" title="재생/일시정지 (Space)">&#10074;&#10074;</button>
    <input type="range" id="sTime" min="0" max="24" step="0.01" value="0" aria-label="진행">
  </div>
  <div class="steps" id="steps"></div>
  <label class="sl"><span>평면과 축의 각 α</span><input type="range" id="sAlpha" min="35" max="75" step="1" value="45"><output id="oAlpha"></output></label>
  <label class="sl"><span>재생 속도</span><input type="range" id="sRate" min="0.25" max="2" step="0.05" value="1"><output id="oRate"></output></label>
  <div class="chips">
    <button id="tSine" aria-pressed="false">y = sin x 늘 겹쳐 보기</button>
    <button id="tProbe" aria-pressed="true">높이 재기</button>
  </div>
</section>

<section class="card" id="math" aria-label="수식">
  <div class="head"><p class="k">왜 사인곡선일까</p><button id="bMath">접기</button></div>
  <div class="body">
    <div class="row">반지름 1 인 원기둥의 옆면 위의 점</div>
    <div class="eq" id="eq1"></div>
    <div class="row">축과 α 의 각을 이루는 평면 (x 축 방향으로 기운다)</div>
    <div class="eq" id="eq2"></div>
    <div class="row">두 식을 함께 만족하는 점, 곧 <b>잘린 자리</b>의 높이는</div>
    <div class="eq" id="eq3"></div>
    <div class="row">높이가 가운데(z = 0)인 θ = −90° 에서 옆면을 잘라 펼친다. 반지름이 1 이므로 펼친 가로 거리 s 는 중심각과 같다.</div>
    <div class="eq" id="eq4"></div>
    <div class="eq" id="eq5"></div>
    <div class="row" id="note"></div>
    <div class="live" id="live"></div>
  </div>
</section>

<div class="caption" id="caption"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const V3 = THREE.Vector3;
const TAU = Math.PI * 2;

/* ═══ 1. 매개변수 ═══════════════════════════════════════════
   z 축이 원기둥의 축. 반지름 R = 1, 높이 −H ≤ z ≤ H.
   자르는 평면 z = k·x  (k = cot α, α 는 평면과 축 사이의 각).
   솔기(펼칠 때 자르는 선)는 θ = −90° 의 모선 — 잘린 자리의 높이가 0 인 곳.
   옆면 위의 점은 (s, z) 로 나타낸다. s = R(θ + 90°) 는 솔기에서 잰 호의 길이.  */
const QS = new URLSearchParams(location.search);
const R = 1, H = 1.8, SMAX = TAU * R;
const P = {
  alpha: (QS.has("alpha") ? +QS.get("alpha") : 45) * Math.PI / 180,
  t: QS.has("t") ? +QS.get("t") : 0, rate: 1, playing: !QS.has("pause"),
};
const TEND = 24;
const derive = () => { P.k = 1 / Math.tan(P.alpha); };
derive();
const zc = (s) => P.k * R * Math.sin(s / R);          // 잘린 자리의 높이 = k·R·cos θ = k·R·sin(s/R)

/* 펼침 정도 λ (0: 원기둥, 1: 평면). 솔기의 한쪽 끝(s = 0)을 붙잡고 곡률 (1−λ)/R 의 원호로 편다. */
function roll(s, lam) {
  const kap = (1 - lam) / R;
  if (kap < 1e-5) return [s, -R];
  return [Math.sin(kap * s) / kap, -R + (1 - Math.cos(kap * s)) / kap];
}

/* ═══ 2. 단계 ═════════════════════════════════════════════ */
const STEPS = [
  { t: 0, text: "반지름 1 인 원기둥" },
  { t: 2, text: "축과 45°를 이루는 평면으로 자른다 — 잘린 면은 타원" },
  { t: 5, text: "위쪽 조각을 들어 올려 치운다" },
  { t: 8, text: "옆면을 <b>높이가 가운데인 곳</b>(파란 선)에서 세로로 자른다" },
  { t: 10.5, text: "옆면을 펼친다 — 잘린 자리(금빛 선)가 어떻게 될까?" },
  { t: 16, text: "펼친 가장자리는 <b>z = sin s</b> — 사인곡선 한 주기" },
];
const smooth = (x) => x * x * (3 - 2 * x);
const ph = (t, a, b) => smooth(Math.min(1, Math.max(0, (t - a) / (b - a))));

/* ═══ 3. 렌더러 ═══════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
// 4K 수준: 화면 너비와 상관없이 가로 3840 픽셀 이상으로 그린 뒤 줄여 보인다 (초과 표본화). ?pr=1 로 끌 수 있다
const pixelRatio = () => (QS.has("pr") ? +QS.get("pr") : Math.min(3, Math.max(devicePixelRatio, 3840 / Math.max(innerWidth, 1))));
renderer.setPixelRatio(pixelRatio());
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
$("stage").appendChild(renderer.domElement);
const labelRenderer = new THREE.CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
$("labels").appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x070b18, 22, 45);
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 200);
camera.up.set(0, 0, 1);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 30;
controls.autoRotateSpeed = 0.6;

{
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: "varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }",
    fragmentShader: `varying vec3 vP;
      void main(){ float h=vP.z*.5+.5;
        vec3 c=mix(vec3(.012,.016,.035), vec3(.05,.07,.16), smoothstep(.3,1.,h));
        c+=vec3(.10,.06,.02)*exp(-pow((h-.48)*9.,2.));
        gl_FragColor=vec4(c,1.); }`,
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16), m));
}
scene.add(new THREE.HemisphereLight(0xcfdcff, 0x241a10, 0.75));
const key = new THREE.DirectionalLight(0xfff1dd, 1.0); key.position.set(4, -8, 9); scene.add(key);
const rim = new THREE.DirectionalLight(0x7fa8ff, 0.55); rim.position.set(-7, 6, 3); scene.add(rim);

/* 바닥 격자 */
{
  const grid = new THREE.GridHelper(24, 48, 0x34508a, 0x1c2a4a);
  grid.rotation.x = Math.PI / 2;
  grid.position.set(2.5, 0, -H - 0.02);
  grid.material.transparent = true; grid.material.opacity = 0.4;
  scene.add(grid);
}

const UP = new V3(0, 1, 0);
function place(m, a, b) {
  const d = new V3().subVectors(b, a), L = d.length();
  m.visible = L > 1e-4;
  if (!m.visible) return;
  m.position.copy(a).addScaledVector(d, 0.5);
  m.scale.set(1, L, 1);
  m.quaternion.setFromUnitVectors(UP, d.normalize());
}
const mkLabel = (html, cls) => { const d = document.createElement("div"); d.className = cls || "lbl"; d.innerHTML = html; return new THREE.CSS2DObject(d); };

/* ═══ 4. 옆면: 아주 얇은 리퀴드 글래스 막 ════════════════════
   격자는 텍스처 대신 셰이더에서 화면 픽셀 단위로 그린다 → 4K 로 그려도 선이 번지지 않는다.
   가로 격자는 s 를 π/4 마다(π/2 마다 굵게), 세로 격자는 z 를 0.25 마다(z = 0 은 굵게).
   바깥면은 푸른 유리, 안쪽면은 따뜻한 호박빛 유리. */
function sheetGlass() {
  return new THREE.ShaderMaterial({
    uniforms: { uOp: { value: 1 }, uH: { value: H } },
    transparent: true, depthWrite: false, side: THREE.DoubleSide, extensions: { derivatives: true },
    vertexShader: `varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      void main(){ vUv=uv; vec4 mv=modelViewMatrix*vec4(position,1.); vN=normalize(normalMatrix*normal); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `uniform float uOp,uH; varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      float line(float x, float w){ float d=abs(fract(x-.5)-.5)/fwidth(x); return 1.-min(d/w,1.); }
      void main(){
        vec3 n=normalize(vN), v=normalize(vV);
        bool outside=gl_FrontFacing;
        if(dot(n,v)<0.) n=-n;
        float fr=pow(1.-clamp(dot(n,v),0.,1.),2.4);
        float z=vUv.y*2.*uH-uH;
        float minor=max(line(vUv.x*16.,.9), line((z+uH)*4.,.9));
        float major=max(line(vUv.x*4.,1.6), 1.-min(abs(z)/fwidth(z)/1.6,1.));
        vec3 r=reflect(-v,n); float sky=smoothstep(-.3,.9,r.y);
        float s1=pow(max(dot(reflect(-normalize(vec3(.45,.7,.55)),n),v),0.),60.)*.8;
        float s2=pow(max(dot(reflect(-normalize(vec3(-.7,.15,.5)),n),v),0.),20.)*.22;
        vec3 irid=.5+.5*cos(6.2831*(fr*1.3+vec3(0.,.33,.67)));
        vec3 base=outside? vec3(.55,.75,1.) : vec3(1.,.72,.42);
        vec3 col=base*(.22+.75*fr) + vec3(.8,.88,1.)*fr*sky*.45 + irid*fr*.16
                + minor*base*.55 + major*mix(base,vec3(1.),.6)*.85 + vec3(1.)*(s1+s2);
        float sheen=exp(-pow(vUv.x*3.-vUv.y*1.2-.4,2.)*18.)*.5+exp(-pow(vUv.x*3.-vUv.y*1.2-1.9,2.)*40.)*.3;   // 유리의 옅은 광택 띠
        col+=vec3(.85,.92,1.)*sheen*.25;
        float a=(outside? .17 : .12) + .45*fr + minor*.3 + major*.55 + sheen*.08 + s1 + s2;
        gl_FragColor=vec4(col, clamp(a,0.,.92)*uOp);
      }`,
  });
}
const sheetMat = sheetGlass(), topSheetMat = sheetGlass();

/* 옆면 조각: lower=true 면 바닥(−H)부터 잘린 자리까지, false 면 잘린 자리부터 위(H)까지 */
const NS = 192, NV = 24;
function makeSheet(lower, mats) {
  const g = new THREE.BufferGeometry();
  const n = (NS + 1) * (NV + 1);
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute("uv", new THREE.BufferAttribute(new Float32Array(n * 2), 2));
  const idx = [];
  for (let i = 0; i < NS; i++) for (let j = 0; j < NV; j++) {
    const A = i * (NV + 1) + j, B = A + 1, C = A + NV + 1, D = C + 1;
    idx.push(A, C, D, A, D, B);
  }
  g.setIndex(idx);
  const grp = new THREE.Group();
  for (const m of mats) grp.add(new THREE.Mesh(g, m));
  grp.userData = { g, lower };
  return grp;
}
function updateSheet(sheet, lam) {
  const { g, lower } = sheet.userData, pos = g.attributes.position.array, uv = g.attributes.uv.array;
  for (let i = 0; i <= NS; i++) {
    const s = (i / NS) * SMAX, top = zc(s), [x, y] = roll(s, lam);
    for (let j = 0; j <= NV; j++) {
      const v = j / NV, z = lower ? -H + v * (top + H) : top + v * (H - top), o = i * (NV + 1) + j;
      pos[o * 3] = x; pos[o * 3 + 1] = y; pos[o * 3 + 2] = z;
      uv[o * 2] = s / SMAX; uv[o * 2 + 1] = (z + H) / (2 * H);
    }
  }
  g.attributes.position.needsUpdate = true; g.attributes.uv.needsUpdate = true;
  g.computeVertexNormals(); g.computeBoundingSphere();
}

const bottom = makeSheet(true, [sheetMat]);
scene.add(bottom);

/* 위쪽 조각: 옆면 + 뚜껑 + 잘린 면 — 통째로 들어 올리고 흐려진다 */
const topPiece = new THREE.Group();
scene.add(topPiece);
const topSheet = makeSheet(false, [topSheetMat]);
topPiece.add(topSheet);
const capMat = new THREE.MeshBasicMaterial({ color: 0x9fc0ff, transparent: true, opacity: 0.1, side: THREE.DoubleSide, depthWrite: false, toneMapped: false });
const topCap = new THREE.Mesh(new THREE.CircleGeometry(R, 96), capMat); topCap.position.z = H;
topPiece.add(topCap);
const botCapMat = capMat.clone();
/* 뚜껑 테두리: 아주 가는 빛 선 */
const rimMat = new THREE.MeshBasicMaterial({ color: 0xcfe0ff, transparent: true, toneMapped: false });
const topRim = new THREE.Mesh(new THREE.TorusGeometry(R, 0.005, 6, 240), rimMat); topRim.position.z = H; topPiece.add(topRim);
const botCap = new THREE.Mesh(new THREE.CircleGeometry(R, 96), botCapMat); botCap.position.z = -H;
scene.add(botCap);

/* 잘린 면(타원) */
const faceMat = new THREE.MeshBasicMaterial({ color: 0xffc860, transparent: true, side: THREE.DoubleSide, depthWrite: false, toneMapped: false });
const faceTopMat = faceMat.clone();
const faceBot = new THREE.Mesh(new THREE.BufferGeometry(), faceMat), faceTop = new THREE.Mesh(new THREE.BufferGeometry(), faceTopMat);
scene.add(faceBot); topPiece.add(faceTop);
function buildFace() {
  const pts = [0, 0, 0], idx = [];
  for (let i = 0; i <= 160; i++) { const th = (i / 160) * TAU; pts.push(R * Math.cos(th), R * Math.sin(th), P.k * R * Math.cos(th)); if (i) idx.push(0, i, i + 1); }
  for (const m of [faceBot, faceTop]) {
    m.geometry.dispose();
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3)); g.setIndex(idx); g.computeVertexNormals();
    m.geometry = g;
  }
}

/* 자르는 평면 z = k x */
const planeMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide, extensions: { derivatives: true },
  uniforms: { uA: { value: 0 } },
  vertexShader: "varying vec2 vL; void main(){ vL=position.xy; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }",
  fragmentShader: `uniform float uA; varying vec2 vL;
    void main(){
      vec2 q=vL*2.; vec2 gq=abs(fract(q-.5)-.5)/fwidth(q);
      float grid=1.-min(min(gq.x,gq.y),1.);
      float edge=1.-smoothstep(0.,.06,min(2.4-abs(vL.x),2.4-abs(vL.y)));
      vec3 col=vec3(.25,.35,.65)*.6+grid*vec3(.45,.6,1.)*.35+edge*vec3(.6,.75,1.);
      gl_FragColor=vec4(col,uA*(.22+grid*.15+edge*.5));
    }`,
});
const cutPlane = new THREE.Mesh(new THREE.PlaneGeometry(4.8, 4.8), planeMat);
cutPlane.renderOrder = 3;
scene.add(cutPlane);
const planeLabel = mkLabel("평면 · 축과 <b>45°</b>");
cutPlane.add(planeLabel);
function orientPlane() {
  const L = Math.hypot(1, P.k), e1 = new V3(1 / L, 0, P.k / L), e2 = new V3(0, 1, 0), n = new V3(-P.k / L, 0, 1 / L);
  cutPlane.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(e1, e2, n));
  planeLabel.position.set(-2.2, 2.2, 0);
  planeLabel.element.innerHTML = `평면 · 축과 <b>${Math.round(P.alpha * 180 / Math.PI)}°</b>`;
}

/* 잘린 자리(금빛 곡선)와 솔기(파란 선) */
const curveMat = new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, toneMapped: false });
const curveGlowMat = new THREE.MeshBasicMaterial({ color: 0xffc04d, transparent: true, toneMapped: false, blending: THREE.AdditiveBlending, depthWrite: false });
const curveMesh = new THREE.Mesh(new THREE.BufferGeometry(), curveMat), curveGlow = new THREE.Mesh(new THREE.BufferGeometry(), curveGlowMat);
curveMesh.add(curveGlow);
scene.add(curveMesh);
const edgeMat = new THREE.MeshBasicMaterial({ color: 0xcfe0ff, transparent: true, opacity: 0.85, toneMapped: false });
const bottomEdge = new THREE.Mesh(new THREE.BufferGeometry(), edgeMat);     // 옆면의 아래 가장자리
scene.add(bottomEdge);
function rodMesh(r, color) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 10), new THREE.MeshBasicMaterial({ color, transparent: true, toneMapped: false })); scene.add(m); return m; }
const seamA = rodMesh(0.008, 0x8fe3ff), seamB = rodMesh(0.008, 0x8fe3ff);
const midDot = new THREE.Mesh(new THREE.SphereGeometry(0.06, 18, 12), new THREE.MeshBasicMaterial({ color: 0x5fd4ff, transparent: true }));
scene.add(midDot);
const seamLabel = mkLabel("높이가 가운데인 곳 · 여기서 자른다", "lbl seam");
midDot.add(seamLabel);
function updateCurve(lam) {
  const pts = [];
  for (let i = 0; i <= 240; i++) { const s = (i / 240) * SMAX, [x, y] = roll(s, lam); pts.push(new V3(x, y - 0.004, zc(s))); }
  curveMesh.geometry.dispose();
  const cv = new THREE.CatmullRomCurve3(pts);
  curveMesh.geometry = new THREE.TubeGeometry(cv, 480, 0.011, 6, false);
  curveGlow.geometry.dispose();
  curveGlow.geometry = new THREE.TubeGeometry(cv, 480, 0.03, 8, false);
  const bp = [];
  for (let i = 0; i <= 240; i++) { const s = (i / 240) * SMAX, [x, y] = roll(s, lam); bp.push(new V3(x, y, -H)); }
  bottomEdge.geometry.dispose();
  bottomEdge.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(bp), 480, 0.005, 5, false);
  const [x0, y0] = roll(0, lam), [x1, y1] = roll(SMAX, lam);
  place(seamA, new V3(x0, y0 - 0.006, -H), new V3(x0, y0 - 0.006, zc(0)));
  place(seamB, new V3(x1, y1 - 0.006, -H), new V3(x1, y1 - 0.006, zc(SMAX)));
  midDot.position.set(x0, y0 - 0.01, 0);
}

/* ═══ 5. 펼친 뒤의 좌표축과 y = sin x ═══════════════════════ */
const graph = new THREE.Group();
scene.add(graph);
const GY = -R - 0.03;
const axMat = new THREE.LineBasicMaterial({ color: 0xeef3ff, transparent: true });
const sineMat = new THREE.LineDashedMaterial({ color: 0xff6f8a, dashSize: 0.1, gapSize: 0.06, transparent: true });
{
  const ax = new THREE.BufferGeometry().setFromPoints([new V3(-0.3, GY, 0), new V3(SMAX + 0.5, GY, 0), new V3(0, GY, -H), new V3(0, GY, 1.6)]);
  graph.add(new THREE.LineSegments(ax, axMat));
  const tk = [];
  [[1, "π/2"], [2, "π"], [3, "3π/2"], [4, "2π"]].forEach(([i, name]) => {
    const x = (i * Math.PI) / 2;
    tk.push(new V3(x, GY, -0.07), new V3(x, GY, 0.07));
    const l = mkLabel(name, "tick"); l.position.set(x, GY, 0); graph.add(l);
  });
  for (const z of [-1, 1]) { tk.push(new V3(-0.07, GY, z), new V3(0.07, GY, z)); const l = mkLabel(String(z), "tick"); l.element.style.transform = "translate(-16px,0)"; l.position.set(-0.12, GY, z); graph.add(l); }
  graph.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(tk), axMat));
  const sx = mkLabel("s", "tick"); sx.position.set(SMAX + 0.6, GY, 0); sx.element.style.transform = "translate(0,0)"; graph.add(sx);
  const sz = mkLabel("z", "tick"); sz.position.set(0, GY, 1.75); sz.element.style.transform = "translate(0,0)"; graph.add(sz);
  const sp = [];
  for (let i = 0; i <= 200; i++) { const x = (i / 200) * SMAX; sp.push(new V3(x, GY - 0.01, Math.sin(x))); }
  const sl = new THREE.Line(new THREE.BufferGeometry().setFromPoints(sp), sineMat);
  sl.computeLineDistances();
  graph.add(sl);
  const lab = mkLabel("y = sin x", "lbl sine"); lab.position.set(Math.PI / 2 + 0.2, GY, 1.3); graph.add(lab);
}

/* 높이 재기: 펼친 뒤 금빛 곡선 위를 달리는 점 */
const probe = new THREE.Group();
scene.add(probe);
const probeDot = new THREE.Mesh(new THREE.SphereGeometry(0.075, 18, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
const probeBar = rodMesh(0.007, 0xffe39a); scene.remove(probeBar); probe.add(probeBar);
probe.add(probeDot);
const probeLabel = mkLabel("", "lbl gold"); probeLabel.element.style.transform = "translate(16px,-18px)";
probeDot.add(probeLabel);

/* ═══ 6. 수식 카드 ═════════════════════════════════════════ */
const tex = (id, s) => katex.render(s, $(id), { displayMode: false, throwOnError: false });
tex("eq1", String.raw`(\cos\theta,\ \sin\theta,\ z)`);
tex("eq2", String.raw`z = x\cot\alpha`);
tex("eq3", String.raw`z=\cot\alpha\cdot\cos\theta`);
tex("eq4", String.raw`s=\theta+90^\circ\ \Rightarrow\ z=\cot\alpha\cdot\cos(s-90^\circ)=\cot\alpha\cdot\sin s`);
function renderMath() {
  const ad = Math.round(P.alpha * 180 / Math.PI);
  tex("eq5", ad === 45 ? String.raw`\alpha=45^\circ\ \Rightarrow\ \cot\alpha=1\ \Rightarrow\ \boxed{z=\sin s}`
                       : String.raw`\alpha=${ad}^\circ\ \Rightarrow\ z=${P.k.toFixed(3)}\,\sin s`);
  $("note").innerHTML = ad === 45
    ? "잘린 면은 장축 √2, 단축 1 인 타원이다. 펼친 옆면의 가로 길이는 원기둥의 둘레 2π — 사인곡선 정확히 한 주기."
    : `α 를 바꾸면 진폭이 cot α = <b>${P.k.toFixed(3)}</b> 로 바뀐다. 분홍 점선 y = sin x 와 견주어 보자. 그래도 주기는 늘 2π (원기둥의 둘레)다.`;
}

/* ═══ 7. 조작 ═════════════════════════════════════════════ */
const sTime = $("sTime"), sAlpha = $("sAlpha"), sRate = $("sRate");
sTime.max = TEND;
function setPlaying(p) { P.playing = p; $("bPlay").innerHTML = p ? "&#10074;&#10074;" : "&#9654;"; }
$("bPlay").addEventListener("click", () => { if (!P.playing && P.t >= TEND - 0.01) P.t = 0; setPlaying(!P.playing); });
addEventListener("keydown", (e) => {
  if (e.target.matches("input")) return;
  if (e.code === "Space") { $("bPlay").click(); e.preventDefault(); }
  if (e.code === "ArrowRight" || e.code === "ArrowLeft") {
    const cur = STEPS.reduce((a, s, i) => (P.t >= s.t - 0.01 ? i : a), 0);
    const nx = Math.max(0, Math.min(STEPS.length - 1, cur + (e.code === "ArrowRight" ? 1 : -1)));
    P.t = STEPS[nx].t; e.preventDefault();
  }
});
sTime.addEventListener("input", () => { P.t = +sTime.value; setPlaying(false); });
STEPS.forEach((st, i) => {
  const b = document.createElement("button"); b.textContent = i + 1; b.title = st.text.replace(/<[^>]+>/g, "");
  b.addEventListener("click", () => { P.t = st.t; setPlaying(true); });
  $("steps").appendChild(b);
});
function readSliders() { $("oAlpha").textContent = sAlpha.value + "°"; $("oRate").textContent = (+sRate.value).toFixed(2) + "×"; }
sAlpha.value = Math.round(P.alpha * 180 / Math.PI);
sAlpha.addEventListener("input", () => { P.alpha = (+sAlpha.value * Math.PI) / 180; readSliders(); rebuild(); });
sRate.addEventListener("input", () => { P.rate = +sRate.value; readSliders(); });
let alwaysSine = false, showProbe = true;
function toggle(id, on, fn) {
  const b = $(id);
  const set = (v) => { b.setAttribute("aria-pressed", String(v)); fn(v); };
  set(on);
  b.addEventListener("click", () => set(b.getAttribute("aria-pressed") !== "true"));
}
toggle("tSine", QS.has("sine"), (v) => { alwaysSine = v; });
toggle("tProbe", true, (v) => { showProbe = v; });
$("bMath").addEventListener("click", () => { const m = $("math"); m.classList.toggle("mini"); $("bMath").textContent = m.classList.contains("mini") ? "펴기" : "접기"; });

let lastLam = -1;
function rebuild() { derive(); updateSheet(topSheet, 0); buildFace(); orientPlane(); renderMath(); lastLam = -1; }

/* 카메라: 펼치는 동안 바라보는 곳을 오른쪽으로 옮기고 조금 물러선다 (사용자가 돌린 각도는 그대로) */
const narrowK = () => (camera.aspect < 1.2 ? Math.min(2.4, 1.3 / camera.aspect) : 1);
const VIEWS = {
  iso: () => new V3(4.2, -7.6, 3.6),
  front: () => new V3(0, -9.5, 0.25),
  top: () => new V3(0.01, -0.8, 10),
};
let focus = { x: 0, s: 1 };
const focusFor = (lam) => ({ x: lam * Math.PI * R, s: (1 + 0.55 * lam) * narrowK() });
let fly = null;
function goView(name, instant) {
  const off = VIEWS[name]().multiplyScalar(focus.s), t = new V3(focus.x, 0, 0);
  $("views").querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === name)));
  if (instant) { camera.position.copy(t).add(off); controls.target.copy(t); return; }
  fly = { o0: camera.position.clone().sub(controls.target), o1: off, u: 0 };
}
$("views").querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => goView(b.dataset.view)));
toggle("bAuto", false, (v) => { controls.autoRotate = v; });
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setPixelRatio(pixelRatio()); renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});

/* ═══ 8. 루프 ════════════════════════════════════════════ */
const LABELS = [];
function syncLabels() {
  for (const l of LABELS) { let v = true; for (let o = l.parent; o; o = o.parent) if (!o.visible) { v = false; break; } l.visible = v; }
}
let probeClock = 0, capIdx = -1, liveTimer = 0;
function apply(t, dt) {
  // ① 평면이 내려와 자른다
  const pin = ph(t, 2, 4.5), pout = ph(t, 8, 9.5);
  cutPlane.position.set(0, 0, (1 - pin) * 3.2);
  planeMat.uniforms.uA.value = pin * (1 - pout);
  cutPlane.visible = pin * (1 - pout) > 0.001;
  planeLabel.element.style.opacity = Math.max(0, pin * (1 - pout) * 2 - 1);
  const cut = ph(t, 4, 5);
  // ② 위쪽 조각을 들어 올린다
  const lift = ph(t, 5, 7.5), fade = 1 - ph(t, 6.5, 8);
  topPiece.position.set(-0.9 * lift, 0, 2.4 * lift);
  topPiece.visible = fade > 0.001;
  topSheetMat.uniforms.uOp.value = rimMat.opacity = fade; capMat.opacity = 0.1 * fade;
  faceTopMat.opacity = cut * fade * 0.4;
  faceTop.visible = cut > 0;
  // ③ 솔기
  const seam = ph(t, 8, 9);
  const pulse = seam * (t < 10.5 ? 0.65 + 0.35 * Math.sin(t * 6) : 1);
  for (const m of [seamA, seamB]) m.material.opacity = pulse;
  midDot.material.opacity = seam;
  midDot.visible = seam > 0.01 && t < 16;
  // 잘린 면과 바닥 뚜껑은 펼치기 전에 치운다
  const away = 1 - ph(t, 9.2, 10.4);
  faceMat.opacity = cut * away * 0.4; faceBot.visible = faceMat.opacity > 0.001;
  botCapMat.opacity = 0.1 * away; botCap.visible = away > 0.001;
  // ④ 펼치기
  const lam = ph(t, 10.5, 16);
  if (Math.abs(lam - lastLam) > 1e-5) { updateSheet(bottom, lam); updateCurve(lam); lastLam = lam; }
  curveMat.opacity = cut; curveGlowMat.opacity = 0.24 * cut;
  curveMesh.visible = cut > 0.001;
  for (const m of [seamA, seamB]) m.visible = m.visible && seam > 0.01;
  // ⑤ 사인곡선 겹치기
  const gr = alwaysSine ? 1 : ph(t, 16, 17.5);
  axMat.opacity = gr * (lam > 0.98 ? 1 : 0.35); sineMat.opacity = gr;
  graph.visible = gr > 0.01 && (lam > 0.98 || alwaysSine);
  // 높이 재기
  const pon = showProbe && lam > 0.999 && t >= 17;
  probe.visible = pon;
  if (pon) {
    probeClock = (probeClock + dt * 0.09) % 1;
    const s = probeClock * SMAX, z = zc(s);
    probeDot.position.set(s, GY - 0.03, z);
    place(probeBar, new V3(s, GY - 0.03, 0), new V3(s, GY - 0.03, z));
    probeLabel.element.textContent = `s = ${(s / Math.PI).toFixed(2)}π,  z = ${z.toFixed(2)}`;
    P.probe = { s, z };
  } else P.probe = null;
  // 카메라
  const f = focusFor(lam);
  if (Math.abs(f.x - focus.x) > 1e-6 || Math.abs(f.s - focus.s) > 1e-6) {
    const off = camera.position.clone().sub(controls.target).multiplyScalar(f.s / focus.s);
    controls.target.x += f.x - focus.x;
    camera.position.copy(controls.target).add(off);
    focus = f;
  }
  // 자막
  const ci = STEPS.reduce((a, s, i) => (t >= s.t - 0.01 ? i : a), 0);
  if (ci !== capIdx) {
    capIdx = ci;
    $("caption").innerHTML = `<span class="n">${ci + 1}/${STEPS.length}</span>${STEPS[ci].text.replace("45°", Math.round(P.alpha * 180 / Math.PI) + "°").replace("z = sin s", Math.round(P.alpha * 180 / Math.PI) === 45 ? "z = sin s" : "z = " + P.k.toFixed(2) + " sin s")}`;
    $("steps").querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", String(i === ci)));
  }
  return lam;
}
function updateLive(lam) {
  const h = [`진행 ${P.t.toFixed(1)} / ${TEND} 초 · 펼친 정도 λ = ${lam.toFixed(2)}`];
  if (P.probe) {
    const { s, z } = P.probe, want = P.k * Math.sin(s);
    h.push(`s = ${(s / Math.PI).toFixed(2)}π (${(s * 180 / Math.PI).toFixed(0)}°)`);
    h.push(`잰 높이 z = <span class="ok">${z.toFixed(3)}</span>`);
    h.push(`<span class="s">${Math.abs(P.k - 1) < 1e-9 ? "sin s" : P.k.toFixed(3) + "·sin s"} = ${want.toFixed(3)}</span> ✓`);
  } else h.push(lam < 0.999 ? "펼친 뒤에 금빛 곡선의 높이를 재어 본다" : "‘높이 재기’를 켜면 곡선 위를 달리는 점이 나온다");
  $("live").innerHTML = h.join("<br>");
}

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (P.playing) {
    P.t += dt * P.rate;
    if (P.t >= TEND) { P.t = TEND; setPlaying(false); }
  }
  sTime.value = P.t;
  const lam = apply(P.t, dt);
  liveTimer -= dt;
  if (liveTimer <= 0) { updateLive(lam); liveTimer = 0.1; }
  if (fly) {
    fly.u = Math.min(1, fly.u + dt / 1.3);
    const k = fly.u < 0.5 ? 2 * fly.u * fly.u : 1 - Math.pow(-2 * fly.u + 2, 2) / 2;
    camera.position.copy(controls.target).add(fly.o0.clone().lerp(fly.o1, k));
    if (fly.u >= 1) fly = null;
  }
  controls.update();
  syncLabels();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* 시작 */
readSliders();
rebuild();
scene.traverse((o) => { if (o.isCSS2DObject) LABELS.push(o); });
focus = focusFor(ph(P.t, 10.5, 16));
goView(QS.get("view") in VIEWS ? QS.get("view") : "iso", true);
if (innerWidth < 860) { $("math").classList.add("mini"); $("bMath").textContent = "펴기"; }
if (QS.has("t")) probeClock = 0.3;
setPlaying(P.playing);
frame();
</script>
</body>
</html>
